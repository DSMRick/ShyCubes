name: ShyCubes
version: '${version}'
main: com.shycubes.ShyCubesPlugin
api-version: '1.21'
description: ShyCubes core plugin with SQLite player stats and extensible floating billboards
authors:
  - DSMRick
softdepend:
  - floodgate
  - Geyser-Spigot

commands:
  leaderboard:
    description: View or manage in-world ShyCubes leaderboard billboards
    usage: /leaderboard [id|list|stats|here|create|remove|delete|refresh|reload|tp]
    aliases:
      - lb
      - topblocks

permissions:
  shycubes.leaderboard.admin:
    description: Allows creating, moving, removing, reloading, and teleporting to leaderboard billboards
    default: op
