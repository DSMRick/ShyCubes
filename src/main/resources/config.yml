# ShyCubes Configuration
database:
  file: "players.db"
  flush-interval-seconds: 5

leaderboard:
  default-billboard: "top_blocks"
  update-interval-seconds: 2
  line-spacing: 0.28

billboards:
  top_blocks:
    enabled: true
    stat: "blocks_broken"
    order: "DESC"
    entries: 10
    unit: "blocks"
    header:
      - "§6§l✦ §e§lMOST BLOCKS BROKEN §6§l✦"
      - "§7ShyCubes Leaderboard"
    auto-place-at-spawn: true
    spawn-offset:
      x: 0.5
      y: 2.8
      z: 3.5
    location:
      world: ""
      x: 0.0
      y: 64.0
      z: 0.0
