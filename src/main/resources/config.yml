# ShyCubes Configuration
database:
  file: "players.db"
  flush-interval-seconds: 5

leaderboard:
  # Auto-spawn near world spawn if no location is set yet
  auto-place-at-spawn: true
  spawn-offset:
    x: 0.5
    y: 2.8
    z: 3.5
  update-interval-seconds: 2
  # Set via '/leaderboard here' in-game (or manually below)
  location:
    enabled: false
    world: "world"
    x: 0.0
    y: 64.0
    z: 0.0
