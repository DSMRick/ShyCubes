name: Restart Minecraft Server

on:
  workflow_dispatch:
    inputs:
      app_log_level:
        description: 'OpenTelemetry Log/Span Level (TRACE, DEBUG, INFO, WARN, ERROR, FATAL)'
        required: false
        default: 'INFO'
        type: choice
        options:
          - TRACE
          - DEBUG
          - INFO
          - WARN
          - ERROR
          - FATAL

permissions:
  contents: read

concurrency:
  group: shycubes-deploy
  cancel-in-progress: false

env:
  DEPLOY_LOCAL: "true"
  DEPLOY_SERVER_ROOT: "/home/opc/mc"
  DEPLOY_REMOTE_DIR: "/home/opc/mc/plugins"
  OTEL_SERVICE_NAME: "shyCubesLogs"
  NR_LOG_PARTITION: "shyCubesLogs"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
  APP_LOG_LEVEL: ${{ inputs.app_log_level || vars.APP_LOG_LEVEL || 'INFO' }}
  RUNNER_KILL_PROCESS_TREE: "0"

jobs:
  restart:
    name: Restart Minecraft Server on OCI
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        run: |
          if [[ ! -d ".git" ]]; then
            git init
            git remote add origin "git@github.com:${GITHUB_REPOSITORY}.git"
          else
            git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          fi
          git fetch --prune origin
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          git reset --hard "${GITHUB_SHA}"
          git clean -fd

      - name: Start OpenTelemetry workflow trace
        run: ./scripts/ci_trace.sh start "ci.restart_server.workflow"

      - name: Sync start.sh and restart server
        run: |
          source ./scripts/common.sh
          cp -f "${CONFIGS_ROOT}/start.sh" "${DEPLOY_SERVER_ROOT}/start.sh"
          chmod +x "${DEPLOY_SERVER_ROOT}/start.sh"
          instrument INFO "server.restart" "${DEPLOY_SERVER_ROOT}/start.sh" --wait
          new_pid="$(pgrep -f "java.*server\.jar" | head -n 1 || true)"
          if [[ -z "${new_pid}" ]]; then
            emit_event ERROR "server.restart.failed" reason="no_java_pid_after_start"
            exit 1
          fi
          emit_event INFO "server.restart.completed" pid="${new_pid}"

      - name: Finish OpenTelemetry workflow trace
        if: always()
        run: ./scripts/ci_trace.sh end "${{ job.status }}"

